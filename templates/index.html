<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0072bc">
    <title>ZHAW CAI News</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #333;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            box-shadow: none;
            background-color: #fff;
            flex: 1;
            display: flex;
            flex-direction: column;
            {% if show_rooms %}
            padding-bottom: calc(20vh + 8px + 46px); /* Space for meeting rooms + progress bar + footer */
            {% else %}
            padding-bottom: calc(8px + 46px); /* Space for progress bar + footer */
            {% endif %}
        }
        
        header {
            background-color: rgb(0, 100, 166);
            width: 100%;
            padding: 20px 40px;
            box-sizing: border-box;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        main {
            padding: 40px;
            flex: 1;
            overflow-y: auto;
        }
        
        .news-item {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .news-content {
            width: 100%;
        }
        
        .news-image {
            float: right;
            width: 30%;
            margin-left: 40px;
            margin-bottom: 20px;
        }
        
        .news-image img {
            width: 100%;
            border-radius: 4px;
        }
        
        h2 {
            font-family: 'Helvetica Rounded', 'Arial Rounded MT Bold', sans-serif;
            font-weight: 400;
            color: white;
            font-size: 2.8rem;
            margin: 0;
            line-height: 1.2;
            text-align: center;
        }
        
        .news-lead {
            font-family: 'Helvetica Rounded', 'Arial Rounded MT Bold', sans-serif;
            font-weight: 300;
            color: rgb(138, 138, 138);
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        
        .news-body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: rgb(51, 51, 51);
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .news-body p, .news-body ul {
            margin-bottom: 20px;
        }
        
        .news-body a {
            color: inherit;
            text-decoration: none;
        }
        
        .news-lead a {
            color: inherit;
            text-decoration: none;
        }
        
        .news-meta {
            margin-bottom: 20px;
            color: #666;
        }
        
        .news-text-content {
            overflow: auto;
        }
        
        footer {
            position: fixed;
            bottom: 8px; /* Above progress bar */
            left: 0;
            right: 0;
            background-color: #f0f0f0;
            padding: 15px 40px;
            color: #666;
            text-align: center;
            z-index: 999;
        }
        
        /* Meeting rooms section */
        .meeting-rooms-section {
            position: fixed;
            bottom: calc(8px + 46px); /* Above progress bar and footer */
            left: 0;
            right: 0;
            background-color: #f9f9f9;
            border-top: 2px solid #0072bc;
            padding: 20px 40px;
            height: 20vh;
            min-height: 200px;
            max-height: 20vh;
            overflow: hidden; /* No scrolling */
            box-sizing: border-box;
        }
        
        .rooms-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            overflow: hidden;
        }
        
        .room-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 15px;
            overflow: hidden; /* No scrolling, truncate content */
            display: flex;
            flex-direction: column;
        }
        
        .room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0072bc;
            flex-shrink: 0; /* Header doesn't shrink */
        }
        
        .room-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0072bc;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .room-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        
        .status-free {
            background-color: #4caf50;
            color: white;
        }
        
        .status-busy {
            background-color: #f44336;
            color: white;
        }
        
        .timeline {
            position: relative;
            flex: 1;
            overflow: hidden; /* Hide overflow, no scrolling */
        }
        
        .time-slot {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 6px;
            border-radius: 3px;
            background-color: #f5f5f5;
            font-size: 0.85rem;
            overflow: hidden;
        }
        
        .event-slot {
            background-color: #ffebee;
            border-left: 3px solid #f44336;
        }
        
        .time-label {
            font-weight: 600;
            min-width: 100px;
            color: #333;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        
        .event-details {
            flex: 1;
            overflow: hidden;
            min-width: 0; /* Allow text truncation */
        }
        
        .event-subject {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .event-organizer {
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #f44336;
            font-size: 0.9rem;
        }
        
        /* Additional responsive styles */
        @media (max-width: 768px) {
            .news-image {
                float: none;
                width: 100%;
                margin-left: 0;
                margin-bottom: 20px;
            }
            
            h2 {
                font-size: 2rem;
            }
            
            .rooms-container {
                grid-template-columns: 1fr;
            }
        }
        
        /* Progress bar for auto-scroll */
        .progress-container {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }
        
        .progress-bar {
            height: 8px;
            background: #0072bc;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2 id="news-title">{{ title }}</h2>
        </header>
        
        <main id="news-content">
            <article class="news-item">
                <div class="news-content">
                    <div class="news-meta">
                        <span class="date" id="news-datetime">{{ datetime }}</span>
                    </div>
                    <div class="news-text-content">
                        <div class="news-image">
                            <img id="news-img" src="{{ image_url }}" alt="{{ title }}">
                        </div>
                        <div class="news-lead">
                            <p id="news-lead"><strong>{{ lead }}</strong></p>
                        </div>
                        <div class="news-body" id="news-paragraphs">
                            {{ paragraphs|safe }}
                        </div>
                    </div>
                </div>
            </article>
        </main>
        
        {% if show_rooms %}
        <div class="meeting-rooms-section">
            <div class="rooms-container">
                <div class="room-card" id="room1-card">
                    <div class="room-header">
                        <h3 class="room-name">{{ room1_name }}</h3>
                        <span class="room-status" id="room1-status">Loading...</span>
                    </div>
                    <div class="timeline" id="room1-timeline">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
                
                <div class="room-card" id="room2-card">
                    <div class="room-header">
                        <h3 class="room-name">{{ room2_name }}</h3>
                        <span class="room-status" id="room2-status">Loading...</span>
                    </div>
                    <div class="timeline" id="room2-timeline">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
    
    <footer>
        <p>© ZHAW Centre for Artificial Intelligence</p>
    </footer>
    
    <!-- Progress bar for auto-scroll visualization -->
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <script>
        let currentNewsId = {{ news_id }};
        let totalNews = {{ total_news }};
        let autoScrollInterval = 20000; // 20 seconds
        let startTime;
        let timerId;
        const showRooms = {{ 'true' if show_rooms else 'false' }};
        
        function loadNews(newsId) {
            fetch(`/next_news/${newsId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('news-title').textContent = data.title;
                    document.getElementById('news-datetime').textContent = data.datetime;
                    document.getElementById('news-lead').innerHTML = `<strong>${data.lead}</strong>`;
                    document.getElementById('news-paragraphs').innerHTML = data.paragraphs;
                    document.getElementById('news-img').src = data.image_url;
                    document.getElementById('news-img').alt = data.title;
                    currentNewsId = data.news_id;
                    totalNews = data.total_news;
                    
                    // Reset and restart the auto-scroll timer
                    resetAutoScroll();
                })
                .catch(error => console.error('Error loading news:', error));
        }
        
        function updateProgressBar() {
            const elapsedTime = Date.now() - startTime;
            const progress = Math.min(elapsedTime / autoScrollInterval * 100, 100);
            document.getElementById('progress-bar').style.width = progress + '%';
            
            if (elapsedTime < autoScrollInterval) {
                requestAnimationFrame(updateProgressBar);
            }
        }
        
        function resetAutoScroll() {
            // Clear any existing timer
            if (timerId) {
                clearTimeout(timerId);
            }
            
            // Reset progress bar
            startTime = Date.now();
            requestAnimationFrame(updateProgressBar);
            
            // Set new timer for auto-scroll
            timerId = setTimeout(function() {
                loadNews((currentNewsId + 1) % totalNews);
            }, autoScrollInterval);
        }
        
        // Meeting rooms functions
        function isCurrentlyBusy(events) {
            const now = new Date();
            return events.some(event => {
                const start = new Date(event.start);
                const end = new Date(event.end);
                return now >= start && now <= end;
            });
        }
        
        function formatTime(dateTimeString) {
            const date = new Date(dateTimeString);
            return date.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false 
            });
        }
        
        function renderTimeline(roomId, events) {
            const timeline = document.getElementById(`${roomId}-timeline`);
            const status = document.getElementById(`${roomId}-status`);
            
            if (events.length === 0) {
                timeline.innerHTML = '<div class="time-slot">No meetings today</div>';
                status.textContent = 'Free';
                status.className = 'room-status status-free';
                return;
            }
            
            const busy = isCurrentlyBusy(events);
            status.textContent = busy ? 'Busy' : 'Free';
            status.className = `room-status ${busy ? 'status-busy' : 'status-free'}`;
            
            let html = '';
            events.forEach(event => {
                const startTime = formatTime(event.start);
                const endTime = formatTime(event.end);
                
                html += `
                    <div class="time-slot event-slot">
                        <div class="time-label">${startTime} - ${endTime}</div>
                        <div class="event-details">
                            <div class="event-subject">${event.subject}</div>
                        </div>
                    </div>
                `;
            });
            
            timeline.innerHTML = html;
        }
        
        function loadRoomCalendar(roomId) {
            const timestamp = new Date().getTime();
            console.log(`[${new Date().toLocaleTimeString()}] Fetching calendar for ${roomId}`);
            
            fetch(`/api/room-calendar/${roomId}?t=${timestamp}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log(`[${new Date().toLocaleTimeString()}] Received data for ${roomId}:`, data);
                    if (data.error) {
                        document.getElementById(`${roomId}-timeline`).innerHTML = 
                            `<div class="error">${data.error}</div>`;
                        return;
                    }
                    renderTimeline(roomId, data.events || []);
                })
                .catch(error => {
                    console.error(`[${new Date().toLocaleTimeString()}] Error loading ${roomId}:`, error);
                    document.getElementById(`${roomId}-timeline`).innerHTML = 
                        '<div class="error">Failed to load</div>';
                });
        }
        
        function refreshRooms() {
            if (showRooms) {
                console.log(`[${new Date().toLocaleTimeString()}] Refreshing all room calendars`);
                loadRoomCalendar('room1');
                loadRoomCalendar('room2');
            }
        }
        
        // Start auto-scroll when page loads
        window.addEventListener('load', function() {
            resetAutoScroll();
            
            // Load meeting rooms if enabled
            if (showRooms) {
                console.log('Page loaded, initializing room calendars');
                refreshRooms();
                // Refresh room calendars every minute
                console.log('Setting up 60-second refresh interval for room calendars');
                setInterval(refreshRooms, 60000);
            }
            
            // Register service worker for PWA support
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service worker registered'))
                    .catch(err => console.log('Service worker registration failed:', err));
            }
        });
    </script>
</body>
</html>
